<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>豆瓣电影筛选</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .movie { display: inline-block; width: 180px; margin: 10px; vertical-align: top; }
        .movie img { width: 100%; border-radius: 8px; }
        .movie-title { font-weight: bold; margin: 5px 0; }
        .controls { margin-bottom: 20px; }
        .loading { text-align: center; font-size: 16px; color: gray; }
    </style>
</head>
<body>
    <div class="controls">
        <label>标签：</label>
        <select id="tagSelect">
            <option value="热门">热门</option>
            <option value="最新">最新</option>
            <option value="经典">经典</option>
            <option value="高分">高分</option>
            <option value="华语">华语</option>
            <option value="欧美">欧美</option>
            <option value="日本">日本</option>
            <option value="韩国">韩国</option>
        </select>

        <label>评分：</label>
        <select id="ratingSelect">
            <option value="0">不限</option>
            <option value="7">7分以上</option>
            <option value="8">8分以上</option>
            <option value="9">9分以上</option>
        </select>

        <button onclick="refreshMovies()">筛选</button>
    </div>

    <div id="movies"></div>
    <div id="loading" class="loading">加载中...</div>

    <script>
        let page = 0;
        let loading = false;
        let hasNext = true;

        async function loadMovies() {
            if (loading || !hasNext) return;
            loading = true;
            document.getElementById('loading').innerText = "加载中...";

            const tag = document.getElementById('tagSelect').value;
            const rating = document.getElementById('ratingSelect').value;
            const resp = await fetch(`/api/movies?tag=${tag}&rating=${rating}&page=${page}`);
            const data = await resp.json();

            const container = document.getElementById('movies');
            data.movies.forEach(m => {
                const div = document.createElement('div');
                div.className = 'movie';
                div.innerHTML = `
                    <a href="${m.url}" target="_blank">
                        <img src="/proxy_image?url=${encodeURIComponent(m.cover)}" alt="${m.title}">
                    </a>
                    <div class="movie-title">${m.title}</div>
                    <div>评分：${m.rate}</div>
                `;
                container.appendChild(div);
            });

            hasNext = data.has_next;
            loading = false;
            page++;
            document.getElementById('loading').innerText = hasNext ? "下拉加载更多..." : "没有更多内容了";
        }

        // 初始加载
        loadMovies();

        // 滚动到底部加载更多
        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) {
                loadMovies();
            }
        });

        // 刷新筛选
        function refreshMovies() {
            document.getElementById('movies').innerHTML = '';
            page = 0;
            hasNext = true;
            loadMovies();
        }
    </script>
</body>
</html>
